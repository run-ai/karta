apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: llama-finetune
  namespace: ml-team
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        spec:
          containers:
            - name: pytorch
              resources:
                requests:
                  nvidia.com/gpu: "1"
    Worker:
      replicas: 4
      template:
        spec:
          containers:
            - name: pytorch
              resources:
                requests:
                  nvidia.com/gpu: "8"
