# End-to-end tests: provision a kind cluster with the selected operators
# (hack/e2e/up.sh) and run the Karta e2e suite against it. Manual trigger
# (workflow_dispatch) defaults to a small 2-operator slice; widen the
# workloads/focus inputs (or leave workloads empty for all) to cover more.
name: E2E

on:
  # Temporary: also run on pull_request so the suite can be validated in CI
  # before this workflow lands on the default branch (workflow_dispatch is only
  # dispatchable once the file is on main). Revert to dispatch-only before merge.
  # On pull_request the inputs below are absent, so the steps fall back to the
  # small default slice (jobset+lws on ubuntu-latest) via `inputs.x || default`.
  pull_request:
  workflow_dispatch:
    inputs:
      workloads:
        description: "Operators to install (space-separated); empty installs all"
        default: "jobset lws"
        type: string
      focus:
        description: "Ginkgo focus regex selecting the cases to run"
        default: "JobSet|LeaderWorkerSet"
        type: string
      runner:
        description: "Runner label. 'ubuntu-latest' handles a small subset; use a dedicated self-hosted / larger runner for the full heavy suite (grove uses a dedicated label for exactly this)."
        default: "ubuntu-latest"
        type: string

jobs:
  e2e:
    name: E2E (kind)
    # Pass a dedicated self-hosted / larger runner for the full suite (many
    # operators: milvus, kserve+knative, dynamo, nim exceed a default 2-4 vCPU
    # hosted runner). Default ubuntu-latest is fine for a small subset.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Install kind, kubectl, helm
        run: |
          # Pinned prebuilt binaries (cert-manager/grove/cluster-api pattern):
          # faster than compiling kind from source and reproducible. up.sh creates
          # the cluster itself, so only the binaries are installed here. Versions
          # are the single source of truth in hack/e2e/versions.env.
          source hack/e2e/versions.env
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo install linux-amd64/helm /usr/local/bin/helm

      - name: Provision cluster + operators
        run: make e2e-up WORKLOADS="${{ inputs.workloads || 'jobset lws' }}"

      - name: Run e2e suite
        run: make test-e2e E2E_FOCUS="${{ inputs.focus || 'JobSet|LeaderWorkerSet' }}"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kind export logs ./e2e-logs --name karta-e2e || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make e2e-down
