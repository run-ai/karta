# End-to-end tests: provision a kind cluster with the selected operators
# (hack/e2e/up.sh) and run the Karta e2e suite against it. Manual trigger for
# now (workflow_dispatch); defaults to a small 2-operator slice. Widen the
# workloads/focus inputs (or leave workloads empty for all) to cover more.
name: E2E

on:
  workflow_dispatch:
    inputs:
      workloads:
        description: "Operators to install (space-separated); empty installs all"
        default: "jobset lws"
        type: string
      focus:
        description: "Ginkgo focus regex selecting the cases to run"
        default: "JobSet|LeaderWorkerSet"
        type: string
      runner:
        description: "Runner label. 'ubuntu-latest' handles a small subset; use a dedicated self-hosted / larger runner for the full heavy suite (grove uses a dedicated label for exactly this)."
        default: "ubuntu-latest"
        type: string

jobs:
  e2e:
    name: E2E (kind)
    # Pass a dedicated self-hosted / larger runner for the full suite (many
    # operators: milvus, kserve+knative, dynamo, nim exceed a default 2-4 vCPU
    # hosted runner). Default ubuntu-latest is fine for a small subset.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Install kind, kubectl, helm
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          kubectl version --client >/dev/null 2>&1 || {
            curl -fsSLo kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install kubectl /usr/local/bin/kubectl
          }
          helm version >/dev/null 2>&1 || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Provision cluster + operators
        run: make e2e-up WORKLOADS="${{ inputs.workloads }}"

      - name: Run e2e suite
        run: make test-e2e E2E_FOCUS="${{ inputs.focus }}"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kind export logs ./e2e-logs --name karta-e2e || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make e2e-down
