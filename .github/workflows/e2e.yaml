#
# End-to-end tests: provision a kind cluster and run the Karta e2e suite against
# it. The full suite (13 cases, all operators) does not fit one 2 vCPU hosted
# runner, so it is sharded across parallel ubuntu-latest jobs, each installing a
# lighter operator subset and running the matching cases. Together the shards
# cover every operator and case, with no self-hosted or larger runner needed.
# This mirrors how KAI-Scheduler, volcano, and crossplane run e2e on hosted
# runners. See docs/design/e2e-runner-size-decision.md.
name: E2E

on:
  # Temporary: run on pull_request so the suite runs in CI before this workflow
  # lands on the default branch (workflow_dispatch is only dispatchable once the
  # file is on main). Revert to dispatch-only before merge.
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each shard is a lighter subset that fits a 2 vCPU runner; the focus
          # regex selects exactly the cases those operators drive. deps are auto
          # added by up.sh (kserve->knative, dynamo->grove). BatchJob is built-in
          # (no operator) so it rides along in the core shard.
          - shard: core
            workloads: "lws jobset kuberay kubeflow"
            focus: "LeaderWorkerSet|JobSet|RayCluster|RayJob|PyTorchJob|MPIJob|BatchJob"
          - shard: serving
            workloads: "knative kserve milvus"
            focus: "KnativeService|KServe|Milvus"
          - shard: inference
            workloads: "grove dynamo nim"
            focus: "Grove|Dynamo|NIMService"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Install kind, kubectl, helm
        run: |
          # Pinned prebuilt binaries (cert-manager/grove/cluster-api pattern):
          # faster than compiling kind from source and reproducible. up.sh creates
          # the cluster itself, so only the binaries are installed here. Versions
          # are the single source of truth in hack/e2e/versions.env.
          source hack/e2e/versions.env
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo install linux-amd64/helm /usr/local/bin/helm

      - name: Provision cluster + operators
        run: make e2e-up WORKLOADS="${{ matrix.workloads }}"

      - name: Run e2e suite
        run: make test-e2e E2E_FOCUS="${{ matrix.focus }}"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kind export logs ./e2e-logs --name karta-e2e || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: e2e-logs
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make e2e-down
