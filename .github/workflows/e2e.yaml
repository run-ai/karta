# End-to-end tests: provision a kind cluster with the selected operators
# (hack/e2e/up.sh) and run the Karta e2e suite against it. By default this runs
# the FULL suite: all operators installed, all cases run. Narrow it with the
# workflow_dispatch workloads/focus inputs for a quick manual subset.
name: E2E

on:
  # Temporary: also run on pull_request so the suite can be validated in CI
  # before this workflow lands on the default branch (workflow_dispatch is only
  # dispatchable once the file is on main). Revert to dispatch-only before merge.
  # On pull_request the inputs below are absent, so the steps install ALL
  # operators and run ALL cases (empty workloads/focus).
  pull_request:
  workflow_dispatch:
    inputs:
      workloads:
        description: "Operators to install (space-separated); empty installs all"
        default: ""
        type: string
      focus:
        description: "Ginkgo focus regex selecting the cases to run; empty runs all"
        default: ""
        type: string
      runner:
        description: "Runner label. ubuntu-latest (2 vCPU/7GB) suits a subset; for the full suite request the self-hosted runner prod-karta-e2e-v1 (8 vCPU/32GB, Docker, amd64) and pass it here. See docs/design/e2e-runner-size-decision.md."
        default: "ubuntu-latest"
        type: string

jobs:
  e2e:
    name: E2E (kind)
    # Full-suite target: a self-hosted runner prod-karta-e2e-v1 (8 vCPU / 32 GB /
    # 150 GB SSD, Docker, amd64), mirroring grove's prod-grove-e2e-v1. ubuntu-latest
    # (2 vCPU) fits the install but starves the Ray dashboard under full-suite load;
    # see docs/design/e2e-runner-size-decision.md. Pass runner=<label> to select it.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      - name: Install kind, kubectl, helm
        run: |
          # Pinned prebuilt binaries (cert-manager/grove/cluster-api pattern):
          # faster than compiling kind from source and reproducible. up.sh creates
          # the cluster itself, so only the binaries are installed here. Versions
          # are the single source of truth in hack/e2e/versions.env.
          source hack/e2e/versions.env
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo install linux-amd64/helm /usr/local/bin/helm

      - name: Provision cluster + operators
        run: make e2e-up WORKLOADS="${{ inputs.workloads }}"

      - name: Run e2e suite
        run: make test-e2e E2E_FOCUS="${{ inputs.focus }}"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kind export logs ./e2e-logs --name karta-e2e || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make e2e-down
