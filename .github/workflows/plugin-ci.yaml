name: Headlamp Plugin

on:
  push:
    branches: [ main, v0.* ]
    paths: [ 'headlamp-plugin/**', 'Makefile' ]
  pull_request:
    branches: [ main, v0.* ]
    paths: [ 'headlamp-plugin/**', 'Makefile' ]

jobs:
  plugin-ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build plugin
        run: make plugin-build
