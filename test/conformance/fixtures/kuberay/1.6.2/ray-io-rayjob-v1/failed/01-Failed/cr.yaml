apiVersion: ray.io/v1
kind: RayJob
metadata:
  finalizers:
  - ray.io/rayjob-finalizer
  name: karta-e2e-rayjob-failed
  namespace: default
spec:
  backoffLimit: 0
  entrypoint: python -c "import time; time.sleep(15); import sys; sys.exit(1)"
  rayClusterSpec:
    headGroupSpec:
      rayStartParams:
        num-cpus: "1"
      template:
        metadata: {}
        spec:
          containers:
          - image: ray-e2e:local
            imagePullPolicy: IfNotPresent
            name: ray-head
            readinessProbe:
              failureThreshold: 90
              initialDelaySeconds: 15
              periodSeconds: 5
              tcpSocket:
                port: 8265
            resources:
              limits:
                cpu: "2"
                memory: 3Gi
              requests:
                cpu: 500m
                memory: 2Gi
    rayVersion: 2.40.0
    workerGroupSpecs:
    - groupName: small
      maxReplicas: 0
      minReplicas: 0
      numOfHosts: 1
      rayStartParams: {}
      replicas: 0
      scaleStrategy: {}
      template:
        metadata: {}
        spec:
          containers:
          - image: ray-e2e:local
            imagePullPolicy: IfNotPresent
            name: ray-worker
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
  submissionMode: K8sJobMode
  ttlSecondsAfterFinished: 0
status:
  failed: 0
  jobDeploymentStatus: Running
  jobStatus: FAILED
  rayClusterStatus:
    conditions:
    - reason: HeadPodRunningAndReady
      status: "True"
      type: HeadPodReady
    - reason: AllPodRunningAndReadyFirstTime
      status: "True"
      type: RayClusterProvisioned
    - reason: RayClusterSuspended
      status: "False"
      type: RayClusterSuspended
    - reason: RayClusterSuspending
      status: "False"
      type: RayClusterSuspending
    desiredCPU: 500m
    desiredGPU: "0"
    desiredMemory: 2Gi
    desiredTPU: "0"
    endpoints:
      client: "10001"
      dashboard: "8265"
      gcs-server: "6379"
      metrics: "8080"
      serve: "8000"
    head: {}
    state: ready
  rayJobInfo: {}
  succeeded: 0
