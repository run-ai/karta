apiVersion: ray.io/v1
kind: RayJob
metadata:
  finalizers:
  - ray.io/rayjob-finalizer
  name: karta-e2e-rayjob-suspended
  namespace: default
spec:
  backoffLimit: 0
  entrypoint: python -c "print(1)"
  rayClusterSpec:
    headGroupSpec:
      rayStartParams:
        num-cpus: "1"
      template:
        metadata: {}
        spec:
          containers:
          - image: ray-e2e:local
            imagePullPolicy: IfNotPresent
            name: ray-head
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
    rayVersion: 2.40.0
    workerGroupSpecs:
    - groupName: small
      maxReplicas: 0
      minReplicas: 0
      numOfHosts: 1
      rayStartParams: {}
      replicas: 0
      scaleStrategy: {}
      template:
        metadata: {}
        spec:
          containers:
          - image: ray-e2e:local
            imagePullPolicy: IfNotPresent
            name: ray-worker
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
  shutdownAfterJobFinishes: true
  submissionMode: K8sJobMode
  suspend: true
  ttlSecondsAfterFinished: 0
status:
  failed: 0
  jobDeploymentStatus: Suspended
  rayClusterStatus:
    desiredCPU: "0"
    desiredGPU: "0"
    desiredMemory: "0"
    desiredTPU: "0"
    head: {}
  rayJobInfo: {}
  succeeded: 0
