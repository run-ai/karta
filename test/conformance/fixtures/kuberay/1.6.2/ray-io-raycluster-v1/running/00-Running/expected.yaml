components:
  head:
    instances:
      "":
        podTemplateSpec:
          spec:
            containers:
            - image: ray-e2e:local
              imagePullPolicy: IfNotPresent
              livenessProbe:
                failureThreshold: 30
                initialDelaySeconds: 30
                periodSeconds: 10
                tcpSocket:
                  port: 6379
              name: ray-head
              readinessProbe:
                failureThreshold: 30
                initialDelaySeconds: 10
                periodSeconds: 5
                tcpSocket:
                  port: 6379
              resources:
                limits:
                  cpu: "1"
                  memory: 2Gi
                requests:
                  cpu: 250m
                  memory: 1Gi
        scale:
          replicas: 1
  raycluster:
    instances:
      "": {}
  worker:
    instances:
      small:
        podTemplateSpec:
          spec:
            containers:
            - image: ray-e2e:local
              imagePullPolicy: IfNotPresent
              name: ray-worker
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
        scale:
          maxReplicas: 1
          minReplicas: 0
          replicas: 0
matchedStatuses:
- Running
phase: ready
