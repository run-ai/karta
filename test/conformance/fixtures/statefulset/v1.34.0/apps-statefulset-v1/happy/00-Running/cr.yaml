apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: karta-e2e-sts
  namespace: default
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: karta-e2e-sts
  template:
    metadata:
      labels:
        app: karta-e2e-sts
    spec:
      containers:
      - command:
        - sh
        - -c
        - sleep infinity
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: worker
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
status:
  availableReplicas: 1
  collisionCount: 0
  currentReplicas: 1
  currentRevision: karta-e2e-sts-844cff5559
  readyReplicas: 1
  replicas: 1
  updateRevision: karta-e2e-sts-844cff5559
  updatedReplicas: 1
