apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: karta-e2e-pytorch-completed
  namespace: default
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
          - command:
            - sh
            - -c
            - sleep 8
            image: busybox:1.36
            name: pytorch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
          - command:
            - sh
            - -c
            - sleep 8
            image: busybox:1.36
            name: pytorch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
status:
  conditions:
  - reason: PyTorchJobCreated
    status: "True"
    type: Created
  - reason: PyTorchJobRunning
    status: "False"
    type: Running
  - reason: PyTorchJobSucceeded
    status: "True"
    type: Succeeded
