apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: karta-e2e-pytorch-suspended
  namespace: default
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
          - command:
            - sleep
            - infinity
            image: busybox:1.36
            name: pytorch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
  runPolicy:
    suspend: true
status:
  conditions:
  - reason: PyTorchJobCreated
    status: "True"
    type: Created
  - reason: PyTorchJobSuspended
    status: "True"
    type: Suspended
