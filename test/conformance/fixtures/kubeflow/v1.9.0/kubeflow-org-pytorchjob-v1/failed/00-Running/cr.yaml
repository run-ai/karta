apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: karta-e2e-pytorch-failed
  namespace: default
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
          - command:
            - sh
            - -c
            - sleep 10; exit 1
            image: busybox:1.36
            name: pytorch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
          - command:
            - sleep
            - infinity
            image: busybox:1.36
            name: pytorch
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
status:
  conditions:
  - reason: PyTorchJobCreated
    status: "True"
    type: Created
  - reason: PyTorchJobRunning
    status: "True"
    type: Running
