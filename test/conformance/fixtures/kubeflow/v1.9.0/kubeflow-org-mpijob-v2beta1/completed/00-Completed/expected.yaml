components:
  launcher:
    instances:
      "":
        podTemplateSpec:
          spec:
            containers:
            - command:
              - "true"
              image: busybox:1.36
              name: mpi-launcher
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
        scale:
          replicas: 1
  mpijob:
    instances:
      "": {}
  worker:
    instances:
      "":
        podTemplateSpec:
          spec:
            containers:
            - command:
              - sleep
              - infinity
              image: busybox:1.36
              name: mpi-worker
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
        scale:
          replicas: 1
conditions:
- reason: MPIJobCreated
  status: "True"
  type: Created
- reason: MPIJobSucceeded
  status: "True"
  type: Succeeded
- reason: MPIJobRunning
  status: "False"
  type: Running
matchedStatuses:
- Completed
- Initializing
