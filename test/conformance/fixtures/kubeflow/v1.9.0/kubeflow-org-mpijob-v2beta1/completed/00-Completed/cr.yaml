apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: karta-e2e-mpi
  namespace: default
spec:
  launcherCreationPolicy: AtStartup
  mpiImplementation: OpenMPI
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
          - command:
            - "true"
            image: busybox:1.36
            name: mpi-launcher
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
    Worker:
      replicas: 1
      template:
        spec:
          containers:
          - command:
            - sleep
            - infinity
            image: busybox:1.36
            name: mpi-worker
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
  runLauncherAsWorker: false
  runPolicy:
    cleanPodPolicy: None
    suspend: false
  slotsPerWorker: 1
  sshAuthMountPath: /root/.ssh
status:
  conditions:
  - reason: MPIJobCreated
    status: "True"
    type: Created
  - reason: MPIJobSucceeded
    status: "True"
    type: Succeeded
  - reason: MPIJobRunning
    status: "False"
    type: Running
