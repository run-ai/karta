apiVersion: v1
kind: Pod
metadata:
  name: karta-e2e-pod
  namespace: default
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - sh
    - -c
    - sleep infinity
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    name: worker
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  initContainers:
  - command:
    - sh
    - -c
    - sleep 8
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    name: init-wait
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Never
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  terminationGracePeriodSeconds: 30
  tolerations:
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 300
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 300
status:
  conditions:
  - status: "True"
    type: PodReadyToStartContainers
  - status: "True"
    type: Initialized
  - status: "True"
    type: Ready
  - status: "True"
    type: ContainersReady
  - status: "True"
    type: PodScheduled
  containerStatuses:
  - allocatedResources:
      cpu: 50m
      memory: 32Mi
    image: docker.io/library/busybox:1.36
    lastState: {}
    name: worker
    ready: true
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    restartCount: 0
    started: true
    state:
      running: {}
    user:
      linux:
        gid: 0
        supplementalGroups:
        - 0
        - 10
  initContainerStatuses:
  - allocatedResources:
      cpu: 10m
      memory: 16Mi
    image: docker.io/library/busybox:1.36
    lastState: {}
    name: init-wait
    ready: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
    restartCount: 0
    started: false
    state:
      terminated:
        exitCode: 0
        reason: Completed
    user:
      linux:
        gid: 0
        supplementalGroups:
        - 0
        - 10
  phase: Running
  qosClass: Burstable
