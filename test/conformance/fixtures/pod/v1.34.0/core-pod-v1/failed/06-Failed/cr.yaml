  - allocatedResources:
      cpu: 10m
      memory: 16Mi
    image: docker.io/library/busybox:1.36
    imageID: public.ecr.aws/docker/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
