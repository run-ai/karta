    image: docker.io/library/busybox:1.36
    imageID: public.ecr.aws/docker/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    lastState: {}
    name: worker
    ready: false
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    restartCount: 0
    started: false
    state:
      terminated:
        exitCode: 1
        reason: Error
    user:
      linux:
        gid: 0
        supplementalGroups:
        - 0
        - 10
