apiVersion: v1
kind: Pod
metadata:
  name: karta-e2e-pod-failed
  namespace: default
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - sh
    - -c
    - sleep 10; exit 1
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    name: worker
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  initContainers:
  - command:
    - sh
    - -c
    - sleep 8
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    name: init-wait
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  nodeName: karta-play-worker
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Never
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  terminationGracePeriodSeconds: 30
  tolerations:
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 300
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 300
status:
