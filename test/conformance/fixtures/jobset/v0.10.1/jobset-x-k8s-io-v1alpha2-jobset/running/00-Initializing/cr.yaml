apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset-running
  namespace: default
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - groupName: default
    name: workers
    replicas: 1
    template:
      metadata: {}
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 1
        parallelism: 1
        template:
          metadata: {}
          spec:
            containers:
            - command:
              - sh
              - -c
              - sleep 300
              image: busybox:1.36
              name: worker
              readinessProbe:
                exec:
                  command:
                  - "true"
                initialDelaySeconds: 6
                periodSeconds: 2
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
            restartPolicy: Never
  startupPolicy:
    startupPolicyOrder: AnyOrder
  successPolicy:
    operator: All
status:
  replicatedJobsStatus:
  - active: 1
    failed: 0
    name: workers
    ready: 0
    succeeded: 0
    suspended: 0
  restarts: 0
