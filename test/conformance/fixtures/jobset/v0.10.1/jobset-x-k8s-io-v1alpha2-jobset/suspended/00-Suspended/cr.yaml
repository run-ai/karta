apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset-suspended
  namespace: default
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - groupName: default
    name: workers
    replicas: 1
    template:
      metadata: {}
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 1
        parallelism: 1
        template:
          metadata: {}
          spec:
            containers:
            - command:
              - "true"
              image: busybox:1.36
              name: worker
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
            restartPolicy: Never
  startupPolicy:
    startupPolicyOrder: AnyOrder
  successPolicy:
    operator: All
  suspend: true
status:
  conditions:
  - reason: SuspendedJobs
    status: "True"
    type: Suspended
  replicatedJobsStatus:
  - active: 0
    failed: 0
    name: workers
    ready: 0
    succeeded: 0
    suspended: 0
  restarts: 0
