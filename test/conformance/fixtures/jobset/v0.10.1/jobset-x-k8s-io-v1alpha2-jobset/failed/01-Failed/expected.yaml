components:
  jobset:
    instances:
      "": {}
  replicatedjob:
    instances:
      workers:
        podTemplateSpec:
          spec:
            containers:
            - command:
              - sh
              - -c
              - sleep 5; exit 1
              image: busybox:1.36
              name: worker
              readinessProbe:
                exec:
                  command:
                  - "false"
                initialDelaySeconds: 1
                periodSeconds: 2
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
            restartPolicy: Never
        scale:
          replicas: 1
conditions:
- reason: FailedJobs
  status: "True"
  type: Failed
matchedStatuses:
- Failed
