apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset-failed
  namespace: default
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - groupName: default
    name: workers
    replicas: 1
    template:
      metadata: {}
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 1
        parallelism: 1
        template:
          metadata: {}
          spec:
            containers:
            - command:
              - sh
              - -c
              - sleep 5; exit 1
              image: busybox:1.36
              name: worker
              readinessProbe:
                exec:
                  command:
                  - "false"
                initialDelaySeconds: 1
                periodSeconds: 2
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
            restartPolicy: Never
  startupPolicy:
    startupPolicyOrder: AnyOrder
  successPolicy:
    operator: All
status:
  conditions:
  - reason: FailedJobs
    status: "True"
    type: Failed
  replicatedJobsStatus:
  - active: 0
    failed: 1
    name: workers
    ready: 0
    succeeded: 0
    suspended: 0
  restarts: 0
  terminalState: Failed
