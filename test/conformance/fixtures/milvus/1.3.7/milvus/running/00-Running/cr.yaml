apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  annotations:
    milvus.io/dependency-values-merged: "true"
    milvus.io/pod-service-label-added: "true"
  finalizers:
  - milvus.milvus.io/finalizer
  labels:
    milvus.io/operator-version: 1.3.7
  name: karta-e2e-milvus
  namespace: default
spec:
  components:
    disableMetric: false
    enableRollingUpdate: true
    image: milvusdb/milvus:v2.6.11
    imageUpdateMode: rollingUpgrade
    metricInterval: ""
    paused: false
    probes: null
    rollingMode: 2
    securityContext: null
    standalone:
      paused: false
      probes: null
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
      securityContext: null
      serviceType: ClusterIP
    targetPortType: string
    updateConfigMapOnly: true
  config:
    dataCoord:
      enableActiveStandby: true
    indexCoord:
      enableActiveStandby: true
    queryCoord:
      enableActiveStandby: true
    rootCoord:
      enableActiveStandby: true
  dependencies:
    customMsgStream: null
    etcd:
      endpoints:
      - karta-e2e-milvus-etcd-0.karta-e2e-milvus-etcd-headless.default:2379
      external: false
      inCluster:
        chartVersion: etcd-v8
        deletionPolicy: Retain
        values:
          auth:
            rbac:
              create: false
              enabled: false
            token:
              enabled: false
          autoCompactionMode: revision
          autoCompactionRetention: "1000"
          enabled: true
          extraEnvVars:
          - name: ETCD_QUOTA_BACKEND_BYTES
            value: "4294967296"
          - name: ETCD_HEARTBEAT_INTERVAL
            value: "500"
          - name: ETCD_ELECTION_TIMEOUT
            value: "2500"
          image:
            pullPolicy: IfNotPresent
            repository: milvusdb/etcd
            tag: 3.5.25-r1
          livenessProbe:
            enabled: true
            timeoutSeconds: 10
          name: etcd
          pdb:
            create: false
          persistence:
            accessMode: ReadWriteOnce
            enabled: true
            size: 10Gi
            storageClass: null
          readinessProbe:
            enabled: true
            periodSeconds: 20
            timeoutSeconds: 10
          replicaCount: 1
          service:
            peerPort: 2380
            port: 2379
            type: ClusterIP
    kafka:
      external: false
    msgStreamType: woodpecker
    natsmq:
      persistence:
        persistentVolumeClaim:
          spec: null
    pulsar:
      endpoint: ""
      external: false
    rocksmq:
      persistence:
        persistentVolumeClaim:
          spec: null
    storage:
      endpoint: karta-e2e-milvus-minio.default:9000
      external: false
      inCluster:
        deletionPolicy: Retain
        values:
          accessKey: minioadmin
          bucketName: milvus-bucket
          enabled: true
          existingSecret: ""
          iamEndpoint: ""
          image:
            pullPolicy: IfNotPresent
            tag: RELEASE.2024-12-18T13-15-44Z
          livenessProbe:
            enabled: true
            failureThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          mode: standalone
          name: minio
          persistence:
            accessMode: ReadWriteOnce
            enabled: true
            existingClaim: ""
            size: 500Gi
            storageClass: null
          podDisruptionBudget:
            enabled: false
          readinessProbe:
            enabled: true
            failureThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          region: ""
          resources:
            requests:
              memory: 256Mi
          rootPath: file
          secretKey: minioadmin
          service:
            port: 9000
            type: ClusterIP
          startupProbe:
            enabled: true
            failureThreshold: 60
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          useIAM: false
          useVirtualHost: false
      secretRef: karta-e2e-milvus-minio
      type: MinIO
    tei:
      enabled: false
    woodpecker:
      persistence:
        persistentVolumeClaim:
          spec: null
  hookConfig: null
  mode: standalone
status:
  componentsDeployStatus:
    standalone:
      image: milvusdb/milvus:v2.6.11
      status:
        availableReplicas: 1
        conditions:
        - reason: MinimumReplicasAvailable
          status: "True"
          type: Available
        - reason: NewReplicaSetAvailable
          status: "True"
          type: Progressing
        readyReplicas: 1
        replicas: 1
        updatedReplicas: 1
  conditions:
  - reason: ReasonMilvusHealthy
    status: "True"
    type: MilvusReady
  - reason: MilvusComponentsUpdated
    status: "True"
    type: MilvusUpdated
  - reason: EtcdReady
    status: "True"
    type: EtcdReady
  - reason: StorageReady
    status: "True"
    type: StorageReady
  - reason: MsgStreamReady
    status: "True"
    type: MsgStreamReady
  currentImage: milvusdb/milvus:v2.6.11
  endpoint: karta-e2e-milvus-milvus.default:19530
  ingress:
    loadBalancer: {}
  rollingModeVersion: 2
  status: Healthy
