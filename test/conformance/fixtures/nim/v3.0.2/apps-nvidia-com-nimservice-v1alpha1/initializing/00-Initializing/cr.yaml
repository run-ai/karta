apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  finalizers:
  - finalizer.nimservice.apps.nvidia.com
  name: karta-e2e-nim-initializing
  namespace: default
spec:
  authSecret: ngc-secret
  expose:
    ingress:
      spec: {}
    service:
      port: 8000
      type: ClusterIP
  image:
    pullPolicy: IfNotPresent
    repository: nim-cpu
    tag: does-not-exist-xyz
  inferencePlatform: standalone
  livenessProbe: {}
  metrics:
    serviceMonitor: {}
  readinessProbe: {}
  replicas: 1
  scale:
    hpa:
      maxReplicas: 0
      minReplicas: 1
  startupProbe: {}
  storage:
    nimCache: {}
    pvc:
      create: true
      size: 1Gi
      volumeAccessMode: ReadWriteOnce
status:
  conditions:
  - reason: NotReady
    status: "False"
    type: Ready
  - reason: Ready
    status: "False"
    type: Failed
  state: NotReady
