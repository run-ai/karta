apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: karta-e2e-lws
  namespace: default
spec:
  leaderWorkerTemplate:
    leaderTemplate:
      metadata: {}
      spec:
        containers:
        - command:
          - sleep
          - infinity
          image: busybox:1.36
          name: leader
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
    restartPolicy: RecreateGroupOnPodRestart
    size: 2
    workerTemplate:
      metadata: {}
      spec:
        containers:
        - command:
          - sleep
          - infinity
          image: busybox:1.36
          name: worker
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
  networkConfig:
    subdomainPolicy: Shared
  replicas: 1
  rolloutStrategy:
    rollingUpdateConfiguration:
      maxSurge: 0
      maxUnavailable: 1
      partition: 0
    type: RollingUpdate
  startupPolicy: LeaderCreated
status:
  conditions:
  - reason: GroupsProgressing
    status: "False"
    type: Progressing
  - reason: AllGroupsReady
    status: "True"
    type: Available
  hpaPodSelector: leaderworkerset.sigs.k8s.io/name=karta-e2e-lws,leaderworkerset.sigs.k8s.io/worker-index=0
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
