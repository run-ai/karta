apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  name: karta-e2e-deploy
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: karta-e2e-deploy
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: karta-e2e-deploy
    spec:
      containers:
      - command:
        - sh
        - -c
        - sleep infinity
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: worker
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
status:
  availableReplicas: 1
  conditions:
  - reason: MinimumReplicasAvailable
    status: "True"
    type: Available
  - reason: NewReplicaSetAvailable
    status: "True"
    type: Progressing
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
