apiVersion: batch/v1
kind: Job
metadata:
  labels:
    batch.kubernetes.io/job-name: karta-e2e-job-resume
    job-name: karta-e2e-job-resume
  name: karta-e2e-job-resume
  namespace: default
spec:
  backoffLimit: 0
  completionMode: NonIndexed
  completions: 1
  manualSelector: false
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  selector:
    matchLabels: {}
  suspend: false
  template:
    metadata:
      labels:
        batch.kubernetes.io/job-name: karta-e2e-job-resume
        job-name: karta-e2e-job-resume
    spec:
      containers:
      - command:
        - sh
        - -c
        - sleep 5
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: worker
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
status:
  conditions:
  - reason: JobResumed
    status: "False"
    type: Suspended
  - reason: CompletionsReached
    status: "True"
    type: SuccessCriteriaMet
  - reason: CompletionsReached
    status: "True"
    type: Complete
  ready: 0
  succeeded: 1
  terminating: 0
