components:
  job:
    instances:
      "":
        podTemplateSpec:
          metadata:
            labels:
              batch.kubernetes.io/job-name: karta-e2e-job-completed
              job-name: karta-e2e-job-completed
          spec:
            containers:
            - command:
              - sh
              - -c
              - sleep 20
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              name: worker
              readinessProbe:
                exec:
                  command:
                  - "true"
                failureThreshold: 3
                initialDelaySeconds: 6
                periodSeconds: 2
                successThreshold: 1
                timeoutSeconds: 1
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
            dnsPolicy: ClusterFirst
            restartPolicy: Never
            schedulerName: default-scheduler
            terminationGracePeriodSeconds: 30
        scale:
          replicas: 1
matchedStatuses:
- Initializing
