apiVersion: batch/v1
kind: Job
metadata:
  labels:
    batch.kubernetes.io/job-name: karta-e2e-job-failed
    job-name: karta-e2e-job-failed
  name: karta-e2e-job-failed
  namespace: default
spec:
  backoffLimit: 0
  completionMode: NonIndexed
  completions: 1
  manualSelector: false
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  selector:
    matchLabels: {}
  suspend: false
  template:
    metadata:
      labels:
        batch.kubernetes.io/job-name: karta-e2e-job-failed
        job-name: karta-e2e-job-failed
    spec:
      containers:
      - command:
        - sh
        - -c
        - sleep 5; exit 1
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: worker
        readinessProbe:
          exec:
            command:
            - "false"
          failureThreshold: 3
          initialDelaySeconds: 1
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
status:
  conditions:
  - reason: BackoffLimitExceeded
    status: "True"
    type: FailureTarget
  - reason: BackoffLimitExceeded
    status: "True"
    type: Failed
  failed: 1
  ready: 0
  terminating: 0
