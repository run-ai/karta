#
# An MPIJob (kubeflow.org/v2beta1) whose Launcher runs `sh -c "sleep 3; exit 1"` and
# fails. With runPolicy.backoffLimit 0 the launcher fails on the first attempt and
# the mpi-operator marks the MPIJob Failed. The sleep lets the recorder catch the
# running state first. The Karta library reads it as Failed.
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: karta-e2e-mpi-failed
  namespace: default
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: None
    backoffLimit: 0
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
            - name: mpi-launcher
              image: busybox:1.36
              command: ["sh", "-c", "sleep 10; exit 1"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
    Worker:
      replicas: 1
      template:
        spec:
          containers:
            - name: mpi-worker
              image: busybox:1.36
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
