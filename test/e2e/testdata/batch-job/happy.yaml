#
# A built-in batch/v1 Job (kube-controller-manager runs it, no operator needed). The
# readiness probe holds the pod not-ready for its initialDelay, so the Job reports
# active=1 ready=0 (Initializing) before active=1 ready=1 (Running), then the command
# exits 0 (Completed). The Karta operator reports CRDExists=False for built-in kinds;
# the library still maps and extracts.
apiVersion: batch/v1
kind: Job
metadata:
  name: karta-e2e-job
  namespace: default
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 20"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 6
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
