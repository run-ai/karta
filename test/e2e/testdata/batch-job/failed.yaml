#
# The bad-path variant of the batch/v1 Job: the container runs briefly and then
# exits non-zero, and backoffLimit 0 means the Job gives up after one attempt and
# sets condition Failed=True. The Karta library should read it as Failed. A distinct
# name keeps it from colliding with the happy-path Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: karta-e2e-job-failed
  namespace: default
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3; exit 1"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
