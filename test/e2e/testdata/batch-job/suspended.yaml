#
# A batch/v1 Job created suspended (spec.suspend=true): no pods are started and the
# Job controller sets condition Suspended=True. The Karta library reads it as
# Suspended. A distinct name keeps it from colliding with the other Job flows.
apiVersion: batch/v1
kind: Job
metadata:
  name: karta-e2e-job-suspended
  namespace: default
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["true"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
