#
# A batch/v1 Job created suspended (spec.suspend=true). The resume flow observes the
# Suspended condition, then clears spec.suspend; the Job then runs `sleep 5` and
# completes. The sleep gives the recorder a stable Running state after the resume, so
# the flow captures Suspended -> Running -> Completed. A distinct name keeps it from
# colliding with the other Job flows.
apiVersion: batch/v1
kind: Job
metadata:
  name: karta-e2e-job-resume
  namespace: default
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 5"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
