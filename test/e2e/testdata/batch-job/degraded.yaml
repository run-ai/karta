#
# An Indexed Job (completions=2, parallelism=2, backoffLimit=0): index 0 exits 0
# (succeeded=1) while index 1 sleeps forever (active/ready=1). The Job never Completes
# (1 of 2 completions) and never Fails, so it settles a stable degraded state -
# parallelism>1, ready<parallelism, and succeeded>0 - which the Karta library reads as
# Degraded.
apiVersion: batch/v1
kind: Job
metadata:
  name: karta-e2e-job-degraded
  namespace: default
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "if [ \"$JOB_COMPLETION_INDEX\" = \"0\" ]; then true; else sleep infinity; fi"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
