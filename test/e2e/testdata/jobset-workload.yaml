#
# A minimal JobSet whose single Job runs `true` and completes immediately, so
# the JobSet reaches a stable Completed condition on a CPU-only kind cluster.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset
  namespace: default
spec:
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command: ["true"]
                  resources:
                    requests: {cpu: 50m, memory: 32Mi}
