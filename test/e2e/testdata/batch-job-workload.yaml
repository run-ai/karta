# A built-in batch/v1 Job that runs `true` and completes immediately. No operator
# is needed (kube-controller-manager runs it). The Karta operator reports
# CRDExists=False for built-in kinds; the library still maps and extracts.
apiVersion: batch/v1
kind: Job
metadata:
  name: karta-e2e-job
  namespace: default
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["true"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
