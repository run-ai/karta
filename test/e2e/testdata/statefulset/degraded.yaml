#
# A StatefulSet that settles Degraded: replicas=2 with a hard pod anti-affinity on
# hostname, so with one schedulable worker exactly one pod becomes ready and the
# second stays Pending. readyReplicas (1) < replicas (2) with updatedReplicas ==
# replicas, which the Karta library reads as Degraded. It cannot self-heal, so the
# degraded state is stable.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: karta-e2e-sts-degraded
  namespace: default
spec:
  serviceName: karta-e2e-sts-degraded
  replicas: 2
  selector:
    matchLabels: {app: karta-e2e-sts-degraded}
  template:
    metadata:
      labels: {app: karta-e2e-sts-degraded}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: karta-e2e-sts-degraded}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
