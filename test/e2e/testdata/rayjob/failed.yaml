#
# A real RayJob whose entrypoint runs briefly then exits non-zero, so KubeRay
# reports .status.jobStatus RUNNING and then FAILED. backoffLimit is 0 so the
# single deterministic failure settles the job Failed without retries. Same
# pre-loaded arch-native image and single-node cluster as the happy flow.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: karta-e2e-rayjob-failed
  namespace: default
spec:
  entrypoint: 'python -c "import time; time.sleep(15); import sys; sys.exit(1)"'
  shutdownAfterJobFinishes: false
  backoffLimit: 0
  rayClusterSpec:
    rayVersion: "2.40.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "1"
      template:
        spec:
          containers:
            - name: ray-head
              image: ray-e2e:local
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 500m, memory: 2Gi}
                limits: {cpu: "2", memory: 3Gi}
              readinessProbe:
                tcpSocket: {port: 8265}
                initialDelaySeconds: 15
                periodSeconds: 5
                failureThreshold: 90
    workerGroupSpecs:
      - groupName: small
        replicas: 0
        minReplicas: 0
        maxReplicas: 0
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: ray-e2e:local
                imagePullPolicy: IfNotPresent
                resources:
                  requests: {cpu: 250m, memory: 512Mi}
