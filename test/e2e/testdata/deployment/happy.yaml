#
# A built-in apps/v1 Deployment with one long-running pod. No operator is needed
# (kube-controller-manager runs it). It goes Progressing -> Available; the Karta
# library reads it as Running once condition Available is True.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karta-e2e-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: karta-e2e-deploy}
  template:
    metadata:
      labels: {app: karta-e2e-deploy}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
