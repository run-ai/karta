#
# A Deployment that settles Failed: an impossible nodeSelector means the pod can never
# schedule, and a short progressDeadlineSeconds makes the Deployment controller flip
# its Progressing condition to False (ProgressDeadlineExceeded). The Karta library
# reads Progressing False as Failed. It cannot self-heal, so the state is stable. Using
# an unschedulable nodeSelector (rather than anti-affinity across nodes) keeps this
# independent of how many workers the cluster has.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karta-e2e-deploy-failed
  namespace: default
spec:
  replicas: 1
  progressDeadlineSeconds: 10
  selector:
    matchLabels: {app: karta-e2e-deploy-failed}
  template:
    metadata:
      labels: {app: karta-e2e-deploy-failed}
    spec:
      nodeSelector:
        karta-e2e/nonexistent: "true"
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
