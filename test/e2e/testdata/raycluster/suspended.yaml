#
# A RayCluster created suspended (spec.suspend=true): the operator starts no head or
# worker pods. The Karta library reads a suspended RayCluster (spec.suspend true, state
# "suspended" or unset) as Suspended.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: karta-e2e-ray-suspended
  namespace: default
spec:
  suspend: true
  rayVersion: "2.40.0"
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        containers:
          - name: ray-head
            image: ray-e2e:local
            imagePullPolicy: IfNotPresent
            resources:
              requests: {cpu: 250m, memory: 1Gi}
  workerGroupSpecs:
    - groupName: small
      replicas: 0
      minReplicas: 0
      maxReplicas: 1
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-worker
              image: ray-e2e:local
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 250m, memory: 512Mi}
