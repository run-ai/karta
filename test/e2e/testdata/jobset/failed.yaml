#
# A JobSet whose single Job runs `sh -c "sleep 3; exit 1"` and fails. With
# backoffLimit 0 the Job fails on the first attempt and, under the default failure
# policy, the JobSet reaches a stable Failed condition. The sleep lets the recorder
# catch the running state on the way. The Karta library reads it as Failed.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset-failed
  namespace: default
spec:
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command: ["sh", "-c", "sleep 10; exit 1"]
                  resources:
                    requests: {cpu: 50m, memory: 32Mi}
