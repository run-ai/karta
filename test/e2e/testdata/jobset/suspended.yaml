#
# A JobSet created suspended (spec.suspend=true): the controller starts no pods and
# sets a Suspended condition. The Karta library reads it as Suspended. A distinct
# name keeps it from colliding with the other JobSet flows.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset-suspended
  namespace: default
spec:
  suspend: true
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command: ["true"]
                  resources:
                    requests: {cpu: 50m, memory: 32Mi}
