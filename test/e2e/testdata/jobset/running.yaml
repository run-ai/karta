#
# A JobSet whose single Job runs `sleep 300`, so its pod stays active and ready and
# the JobSet's replicatedJobsStatus reports a running job. The Karta library reads it
# as Running.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset-running
  namespace: default
spec:
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command: ["sh", "-c", "sleep 300"]
                  resources:
                    requests: {cpu: 50m, memory: 32Mi}
