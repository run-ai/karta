#
# A minimal JobSet whose single Job runs then exits 0. The readiness probe holds the
# pod not-ready for its initialDelay, so the JobSet reports a replicatedJob active=1
# ready=0 (Initializing) before active=1 ready=1 (Running), then the command exits 0
# (Completed) on a CPU-only kind cluster.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset
  namespace: default
spec:
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command: ["sh", "-c", "sleep 20"]
                  readinessProbe:
                    exec:
                      command: ["true"]
                    initialDelaySeconds: 6
                    periodSeconds: 2
                  resources:
                    requests: {cpu: 50m, memory: 32Mi}
