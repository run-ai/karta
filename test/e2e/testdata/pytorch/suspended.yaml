#
# A PyTorchJob created suspended (spec.runPolicy.suspend=true): no pods start and the
# training-operator sets a Suspended condition. The Karta library reads it as Suspended.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: karta-e2e-pytorch-suspended
  namespace: default
spec:
  runPolicy:
    suspend: true
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
            - name: pytorch
              image: busybox:1.36
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
