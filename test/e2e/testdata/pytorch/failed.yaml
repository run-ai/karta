#
# A PyTorchJob whose Master runs `sh -c "sleep 3; exit 1"` and fails. With
# restartPolicy Never the Master exits non-zero and the training-operator marks the
# PyTorchJob Failed. The sleep lets the recorder catch the running state first. The
# container must be named "pytorch" for the operator to manage it. The Karta library
# reads it as Failed.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: karta-e2e-pytorch-failed
  namespace: default
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
            - name: pytorch
              image: busybox:1.36
              command: ["sh", "-c", "sleep 10; exit 1"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
            - name: pytorch
              image: busybox:1.36
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
