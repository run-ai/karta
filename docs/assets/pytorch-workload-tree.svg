<svg viewBox="0 0 1160 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Workload tree derived from a PyTorchJob via its Karta definition</title>
  <desc>A PyTorchJob named demo, status Running, with a master component (1 of 1 ready, 1 GPU) and a workers component (4 of 4 ready, 8 GPUs per pod, 32 total), each resolved down to its pods and nodes.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#eceff3" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1160" height="470" rx="12" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1160" height="470" rx="12" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1159" height="469" rx="12" fill="none" stroke="#d0d7de"/>

  <!-- connectors -->
  <g fill="none" stroke="#b6c2cd" stroke-width="1.5">
    <path d="M 580 128 L 580 152 L 345 152 L 345 186"/>
    <path d="M 580 128 L 580 152 L 815 152 L 815 186"/>
    <path d="M 345 282 L 345 336"/>
    <path d="M 815 282 L 815 308 L 645 308 L 645 336"/>
    <path d="M 815 282 L 815 308 L 837 308 L 837 336"/>
    <path d="M 815 282 L 815 308 L 1009 308 L 1009 336"/>
  </g>

  <!-- root card: PyTorchJob/demo -->
  <g>
    <rect x="425" y="40" width="310" height="88" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="443" y="56" width="30" height="30" rx="7" fill="#ee4c2c"/>
    <text x="458" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">PT</text>
    <text x="485" y="70" font-size="15" font-weight="700" fill="#1f2328">demo</text>
    <text x="485" y="88" font-size="12" fill="#57606a">PyTorchJob &#183; kubeflow.org/v1</text>
    <rect x="651" y="54" width="68" height="22" rx="11" fill="#dafbe1"/>
    <text x="685" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#116329">Running</text>
    <text x="443" y="112" font-size="12" fill="#57606a">5 pods &#183; 33 GPUs requested &#183; gang scheduled</text>
  </g>

  <!-- component card: master -->
  <g>
    <rect x="180" y="186" width="330" height="96" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="180" y="186" width="4" height="96" rx="2" fill="#0969da"/>
    <text x="202" y="214" font-size="14" font-weight="700" fill="#1f2328">master</text>
    <rect x="258" y="200" width="30" height="20" rx="10" fill="#ddf4ff"/>
    <text x="273" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">x1</text>
    <text x="202" y="240" font-size="12.5" fill="#57606a">1/1 ready &#183; 1 GPU per pod</text>
    <text x="202" y="262" font-size="12.5" fill="#57606a">component &#183; Pod</text>
  </g>

  <!-- component card: workers -->
  <g>
    <rect x="650" y="186" width="330" height="96" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="650" y="186" width="4" height="96" rx="2" fill="#0969da"/>
    <text x="672" y="214" font-size="14" font-weight="700" fill="#1f2328">workers</text>
    <rect x="738" y="200" width="30" height="20" rx="10" fill="#ddf4ff"/>
    <text x="753" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">x4</text>
    <text x="672" y="240" font-size="12.5" fill="#57606a">4/4 ready &#183; 8 GPUs per pod &#183; 32 total</text>
    <text x="672" y="262" font-size="12.5" fill="#57606a">component &#183; Pod</text>
  </g>

  <!-- pod card: master pod -->
  <g>
    <rect x="255" y="336" width="180" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="271" y="360" font-size="12.5" font-weight="600" fill="#1f2328">demo-master-0</text>
    <circle cx="277" cy="376" r="4" fill="#1a7f37"/>
    <text x="287" y="380" font-size="11.5" fill="#57606a">Running</text>
    <text x="271" y="398" font-size="11.5" fill="#57606a">node-01 &#183; 1 GPU</text>
  </g>

  <!-- pod card: worker 0 -->
  <g>
    <rect x="555" y="336" width="180" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="571" y="360" font-size="12.5" font-weight="600" fill="#1f2328">demo-worker-0</text>
    <circle cx="577" cy="376" r="4" fill="#1a7f37"/>
    <text x="587" y="380" font-size="11.5" fill="#57606a">Running</text>
    <text x="571" y="398" font-size="11.5" fill="#57606a">node-02 &#183; 8 GPUs</text>
  </g>

  <!-- pod card: worker 1 -->
  <g>
    <rect x="747" y="336" width="180" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="763" y="360" font-size="12.5" font-weight="600" fill="#1f2328">demo-worker-1</text>
    <circle cx="769" cy="376" r="4" fill="#1a7f37"/>
    <text x="779" y="380" font-size="11.5" fill="#57606a">Running</text>
    <text x="763" y="398" font-size="11.5" fill="#57606a">node-03 &#183; 8 GPUs</text>
  </g>

  <!-- pod card: +2 more -->
  <g>
    <rect x="939" y="336" width="140" height="70" rx="10" fill="#ffffff" stroke="#b6c2cd" stroke-dasharray="4 3"/>
    <text x="1009" y="375" text-anchor="middle" font-size="12" fill="#57606a">+2 more pods</text>
  </g>

  <!-- footer -->
  <text x="24" y="446" font-size="11.5" fill="#8b949e">Derived from docs/samples/pytorch.yaml &#183; no PyTorchJob-specific code</text>
</svg>
