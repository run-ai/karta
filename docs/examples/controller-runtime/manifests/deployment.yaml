apiVersion: apps/v1
kind: Deployment
metadata:
  name: generic-controller
  namespace: karta-system
  labels:
    app.kubernetes.io/name: generic-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-controller
    spec:
      serviceAccountName: generic-controller
      containers:
        - name: controller
          # Built and side-loaded with `kind load docker-image` (see README).
          image: generic-controller-example:latest
          imagePullPolicy: IfNotPresent
          args:
            - --karta-name=batch-v1-job
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
