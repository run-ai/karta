#
# A LeaderWorkerSet: one group of size 2 (one leader plus one worker).
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: karta-demo-lws
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    leaderTemplate:
      spec:
        containers:
          - name: leader
            image: busybox:1.37
            command: ["sh", "-c", "echo leader && exec tail -f /dev/null"]
            resources:
              requests:
                cpu: "100m"
                memory: "64Mi"
    workerTemplate:
      spec:
        containers:
          - name: worker
            image: busybox:1.37
            command: ["sh", "-c", "echo worker && exec tail -f /dev/null"]
            resources:
              requests:
                cpu: "100m"
                memory: "64Mi"
