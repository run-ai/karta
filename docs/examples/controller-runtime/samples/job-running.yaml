#
# A normal (non-suspended) Job. The controller still inspects it through Karta
# and writes the karta.run.ai/* annotations, but the pod template is immutable
# once the Job is running, so the label injection is skipped and the controller
# records a PodTemplateImmutable event instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: karta-demo-running
spec:
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo hello from karta && sleep 30"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
