#
# A JobSet created suspended (spec.suspend: true). Unlike a plain Job, the pod
# template lives inside a child component (the replicatedJob), and the workload
# has multiple instances. The controller reconciles it with the exact same code
# path as the Job: Karta resolves where the template and replica counts live.
#
# While suspended the pod templates are mutable, so the controller injects the
# managed-by label. Resume with:
#   kubectl patch jobset karta-demo-jobset --type=merge -p '{"spec":{"suspend":false}}'
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-demo-jobset
spec:
  suspend: true
  replicatedJobs:
    - name: workers
      replicas: 2
      template:
        spec:
          parallelism: 2
          completions: 2
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command: ["sh", "-c", "echo hello from karta && sleep 10"]
                  resources:
                    requests:
                      cpu: "250m"
                      memory: "128Mi"
