apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: kubeflow-org-pytorchjob-v1-with-suspend
spec:
  structureDefinition:
    rootComponent:
      name: pytorchjob
      kind:
        group: kubeflow.org
        version: v1
        kind: PyTorchJob
      # suspendDefinition lists the field assignments applied when suspending or
      # resuming this workload. Each action sets a target path to a JSON value.
      # PyTorchJob supports native suspension via spec.suspend (batch-style).
      suspendDefinition:
        suspendActions:
          - path: .spec.suspend
            value: "true"
        resumeActions:
          - path: .spec.suspend
            value: "false"
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          initializing:
          - byConditions:
              - type: Created
                status: "True"
          running:
          - byConditions:
              - type: Running
                status: "True"
              - type: "Succeeded"
                status: "False"
              - type: Failed
                status: "False"
          completed:
          - byConditions:
              - type: Succeeded
                status: "True"
          failed:
          - byConditions:
              - type: Failed
                status: "True"
          suspended:
          - byConditions:
              - type: Suspended
                status: "True"
          suspending:
          - byConditions:
              - type: Suspending
                status: "True"
          resuming:
          - byConditions:
              - type: Resuming
                status: "True"
    childComponents:
      - name: master
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: pytorchjob
        specDefinition:
          podTemplateSpecPath: .spec.pytorchReplicaSpecs.Master.template
        scaleDefinition:
          replicasPath: .spec.pytorchReplicaSpecs.Master.replicas // 1
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["training.kubeflow.org/replica-type"]
            value: master
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: pytorchjob
        specDefinition:
          podTemplateSpecPath: .spec.pytorchReplicaSpecs.Worker.template
        scaleDefinition:
          replicasPath: .spec.pytorchReplicaSpecs.Worker.replicas // 1
          minReplicasPath: .spec.elasticPolicy.minReplicas
          maxReplicasPath: .spec.elasticPolicy.maxReplicas
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["training.kubeflow.org/replica-type"]
            value: worker
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: master
              groupByKeyPaths:
                - .metadata.labels["training.kubeflow.org/job-name"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["training.kubeflow.org/job-name"]
