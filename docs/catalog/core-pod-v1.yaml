apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: core-pod-v1
spec:
  optimizationInstructions: {}
  structureDefinition:
    rootComponent:
      kind:
        group: ""
        kind: Pod
        version: v1
      name: pod
      scaleDefinition:
        replicasPath: "1"
      specDefinition:
        podTemplateSpecPath: .
      statusDefinition:
        conditionsDefinition:
          messageFieldName: message
          path: .status.conditions
          reasonFieldName: reason
          statusFieldName: status
          typeFieldName: type
        phaseDefinition:
          path: .status.phase
        statusMappings:
          completed:
          - byPhase: Succeeded
          failed:
          - byPhase: Failed
          initializing:
          - byPhase: Pending
          running:
          - byPhase: Running
