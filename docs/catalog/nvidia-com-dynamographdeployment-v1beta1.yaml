apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: nvidia-com-dynamographdeployment-v1beta1
spec:
  optimizationInstructions:
    gangScheduling:
      podGroups:
      - members:
        - componentName: component
          groupByKeyPaths:
          - .metadata.labels["nvidia.com/dynamo-component"] | ascii_downcase
        name: component
  structureDefinition:
    additionalChildKinds:
    - group: nvidia.com
      kind: DynamoComponentDeployment
      version: v1beta1
    - group: leaderworkerset.x-k8s.io
      kind: LeaderWorkerSet
      version: v1
    - group: scheduler.grove.io
      kind: PodGang
      version: v1alpha1
    - group: grove.io
      kind: PodClique
      version: v1alpha1
    - group: grove.io
      kind: PodCliqueSet
      version: v1alpha1
    - group: grove.io
      kind: PodCliqueScalingGroup
      version: v1alpha1
    childComponents:
    - instanceIdPath: .spec.components[] | .name
      name: component
      ownerRef: dynamographdeployment
      podSelector:
        componentInstanceSelector:
          idPath: .metadata.labels["nvidia.com/dynamo-component"]
        replicaSelector:
          keyPath: .metadata.labels["grove.io/podcliquescalinggroup-replica-index"]
            // .metadata.labels["leaderworkerset.sigs.k8s.io/group-index"]
      scaleDefinition:
        replicasPath: .spec.components[] | (.replicas // 1) * (.multinode.nodeCount
          // 1)
      specDefinition:
        fragmentedPodSpecDefinition:
          annotationsPath: .spec.components[] | .podTemplate.metadata.annotations
          containerPath: .spec.components[] | .podTemplate.spec.containers[] | select(.name
            == "main")
          imagePath: .spec.components[] | .podTemplate.spec.containers[] | select(.name
            == "main") | .image
          labelsPath: .spec.components[] | .podTemplate.metadata.labels
          nodeAffinityPath: .spec.components[] | .podTemplate.spec.affinity.nodeAffinity
          podAffinityPath: .spec.components[] | .podTemplate.spec.affinity.podAffinity
          priorityClassNamePath: .spec.components[] | .podTemplate.spec.priorityClassName
          resourceClaimsPath: .spec.components[] | .podTemplate.spec.resourceClaims
          schedulerNamePath: .spec.components[] | .podTemplate.spec.schedulerName
    rootComponent:
      kind:
        group: nvidia.com
        kind: DynamoGraphDeployment
        version: v1beta1
      name: dynamographdeployment
      statusDefinition:
        phaseDefinition:
          path: .status.state
        statusMappings:
          failed:
          - byPhase: failed
          initializing:
          - byPhase: initializing
          - byPhase: pending
          running:
          - byPhase: successful
