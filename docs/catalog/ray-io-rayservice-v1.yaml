apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: ray-io-rayservice-v1
spec:
  optimizationInstructions:
    gangScheduling:
      podGroups:
      - members:
        - componentName: head
          groupByKeyPaths:
          - .metadata.labels["ray.io/cluster"]
        - componentName: worker
          groupByKeyPaths:
          - .metadata.labels["ray.io/cluster"]
        name: service
  structureDefinition:
    childComponents:
    - kind:
        group: ""
        kind: Pod
        version: v1
      name: head
      ownerRef: rayservice
      podSelector:
        componentTypeSelector:
          keyPath: .metadata.labels["ray.io/node-type"]
          value: head
      scaleDefinition:
        replicasPath: "1"
      specDefinition:
        podTemplateSpecPath: .spec.rayClusterConfig.headGroupSpec.template
    - instanceIdPath: .spec.rayClusterConfig.workerGroupSpecs[].groupName
      kind:
        group: ""
        kind: Pod
        version: v1
      name: worker
      ownerRef: rayservice
      podSelector:
        componentInstanceSelector:
          idPath: .metadata.labels["ray.io/group"]
        componentTypeSelector:
          keyPath: .metadata.labels["ray.io/node-type"]
          value: worker
      scaleDefinition:
        replicasPath: .spec.rayClusterConfig.workerGroupSpecs[].replicas // 1
      specDefinition:
        podTemplateSpecPath: .spec.rayClusterConfig.workerGroupSpecs[].template
    rootComponent:
      kind:
        group: ray.io
        kind: RayService
        version: v1
      name: rayservice
      statusDefinition:
        conditionsDefinition:
          messageFieldName: message
          path: .status.conditions
          reasonFieldName: reason
          statusFieldName: status
          typeFieldName: type
        statusMappings:
          degraded:
          - byConditions:
            - reason: ZeroServeEndpoints
              status: "False"
              type: Ready
          failed:
          - byConditions:
            - reason: InitializingTimeout
              status: "False"
              type: Ready
          - byConditions:
            - reason: ValidationFailed
              status: "False"
              type: Ready
          initializing:
          - byConditions:
            - reason: Initializing
              status: "False"
              type: Ready
          running:
          - byConditions:
            - status: "True"
              type: Ready
