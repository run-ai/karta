apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: apps-statefulset-v1
spec:
  optimizationInstructions: {}
  structureDefinition:
    rootComponent:
      kind:
        group: apps
        kind: StatefulSet
        version: v1
      name: statefulset
      scaleDefinition:
        replicasPath: .spec.replicas // 1
      specDefinition:
        podTemplateSpecPath: .spec.template
      statusDefinition:
        statusMappings:
          degraded:
          - byExpression:
              expectedResult: "true"
              expression: (.status.readyReplicas // 0) > 0 and (.status.readyReplicas
                // 0) < (.spec.replicas // 1) and (.status.updatedReplicas // 0) ==
                (.spec.replicas // 1) and (.status.currentRevision == .status.updateRevision)
                and (.status.observedGeneration // 0) == (.metadata.generation //
                0)
          initializing:
          - byExpression:
              expectedResult: "true"
              expression: (.spec.replicas // 1) > 0 and ((.status.observedGeneration
                // 0) != (.metadata.generation // 0) or (.status.readyReplicas //
                0) == 0 or (.status.updatedReplicas // 0) != (.spec.replicas // 1)
                or (.status.currentRevision != .status.updateRevision))
          running:
          - byExpression:
              expectedResult: "true"
              expression: (.status.observedGeneration // 0) == (.metadata.generation
                // 0) and (.status.readyReplicas // 0) == (.spec.replicas // 1) and
                (.status.updatedReplicas // 0) == (.spec.replicas // 1) and (.status.currentRevision
                == .status.updateRevision)
