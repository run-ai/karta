apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: kubeflow-org-mpijob-v2beta1
spec:
  structureDefinition:
    rootComponent:
      name: mpijob
      kind:
        group: kubeflow.org
        version: v2beta1
        kind: MPIJob
      suspendDefinition:
        suspendActions:
          - path: .spec.runPolicy.suspend
            value: "true"
        resumeActions:
          - path: .spec.runPolicy.suspend
            value: "false"
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          reasonFieldName: reason
          messageFieldName: message
        statusMappings:
          initializing:
          - byConditions:
              - type: Created
                status: "True"
          running:
          - byConditions:
              - type: Running
                status: "True"
          completed:
          - byConditions:
              - type: Succeeded
                status: "True"
          failed:
          - byConditions:
              - type: Failed
                status: "True"
          suspended:
          - byConditions:
              - type: Suspended
                status: "True"
    childComponents:
      - name: launcher
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: mpijob
        specDefinition:
          podTemplateSpecPath: .spec.mpiReplicaSpecs.Launcher.template
        scaleDefinition:
          replicasPath: .spec.mpiReplicaSpecs.Launcher.replicas // 1
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["training.kubeflow.org/replica-type"]
            value: launcher
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: mpijob
        specDefinition:
          podTemplateSpecPath: .spec.mpiReplicaSpecs.Worker.template
        scaleDefinition:
          replicasPath: .spec.mpiReplicaSpecs.Worker.replicas // 1
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["training.kubeflow.org/replica-type"]
            value: worker
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: launcher
              groupByKeyPaths:
                - .metadata.labels["training.kubeflow.org/job-name"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["training.kubeflow.org/job-name"]
