apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: batch-cronjob-v1
spec:
  structureDefinition:
    rootComponent:
      name: cronjob
      kind:
        group: batch
        version: v1
        kind: CronJob
      scaleDefinition:
        replicasPath: .spec.jobTemplate.spec.parallelism // 1
      specDefinition:
        podTemplateSpecPath: .spec.jobTemplate.spec.template
      suspendDefinition:
        suspendActions:
          - path: .spec.suspend
            value: "true"
        resumeActions:
          - path: .spec.suspend
            value: "false"
      statusDefinition:
        statusMappings:
          initializing:
          - byExpression:
              expression: (.spec.suspend // false) != true and (.status.lastScheduleTime == null)
              expectedResult: "true"
          running:
          - byExpression:
              expression: (.spec.suspend // false) != true and (.status.lastScheduleTime != null)
              expectedResult: "true"
          suspended:
          - byExpression:
              expression: (.spec.suspend // false) == true
              expectedResult: "true"
    childComponents:
      - name: job
        kind:
          group: batch
          version: v1
          kind: Job
        ownerRef: cronjob
