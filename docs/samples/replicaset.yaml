apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: apps-replicaset-v1
spec:
  structureDefinition:
    rootComponent:
      name: replicaset
      kind:
        group: apps
        version: v1
        kind: ReplicaSet
      scaleDefinition:
        replicasPath: .spec.replicas // 1
      specDefinition:
        podTemplateSpecPath: .spec.template
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          reasonFieldName: reason
          messageFieldName: message
        statusMappings:
          initializing:
          - byExpression:
              expression: (.status.availableReplicas // 0) < (.spec.replicas // 1)
              expectedResult: "true"
          running:
          - byExpression:
              expression: .status.availableReplicas == (.spec.replicas // 1)
              expectedResult: "true"
