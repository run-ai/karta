apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: workspace-devfile-io-devworkspace-v1alpha2
spec:
  structureDefinition:
    rootComponent:
      name: devworkspace
      kind:
        group: workspace.devfile.io
        version: v1alpha2
        kind: DevWorkspace
      scaleDefinition:
        replicasPath: "1"
      specDefinition:
        podTemplateSpecPath: .spec.template
      statusDefinition:
        phaseDefinition:
          path: .status.phase
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          reasonFieldName: reason
          messageFieldName: message
        statusMappings:
          initializing:
          - byPhase: Starting
          running:
          - byPhase: Running
          failed:
          - byPhase: Failed
