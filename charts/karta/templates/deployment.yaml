{{- if .Values.operator.enabled -}}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection.enabled) -}}
  {{- fail "replicaCount > 1 requires leaderElection.enabled=true; without leader election multiple replicas reconcile concurrently" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karta.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "karta.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "karta.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "karta.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            - --leader-election-id={{ .Values.leaderElection.id }}
            {{- end }}
            - --metrics-bind-address=:{{ .Values.ports.metrics }}
            - --health-probe-bind-address=:{{ .Values.ports.health }}
            - --zap-log-level={{ .Values.logLevel }}
            {{- if .Values.webhook.enabled }}
            - --enable-webhook
            - --webhook-port={{ .Values.webhook.port }}
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
            - --webhook-cert-source={{ .Values.webhook.cert.source }}
            - --webhook-cert-secret={{ include "karta.webhook.secretName" . }}
            - --webhook-service-name={{ include "karta.webhook.serviceName" . }}
            - --mutating-webhook-name={{ include "karta.webhook.configName" . }}
            - --validating-webhook-name={{ include "karta.webhook.validatingConfigName" . }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
            - name: health
              containerPort: {{ .Values.ports.health }}
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            {{- if eq .Values.webhook.cert.source "existingSecret" }}
            secretName: {{ required "webhook.cert.existingSecret.name is required when webhook.cert.source=existingSecret" .Values.webhook.cert.existingSecret.name }}
            {{- else }}
            secretName: {{ include "karta.webhook.secretName" . }}
            {{- end }}
            optional: true
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
