{{- if and .Values.operator.enabled .Values.webhook.enabled (eq .Values.webhook.cert.provisionMode "auto") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "karta.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "karta.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "karta.fullname" . }}-webhook-cert
subjects:
  - kind: ServiceAccount
    name: {{ include "karta.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
