{{- if and .Values.operator.enabled .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "karta.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end -}}
