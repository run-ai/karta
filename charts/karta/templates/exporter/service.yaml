{{- if .Values.exporter.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "karta.exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.exporter.ports.metrics }}
      targetPort: metrics
      protocol: TCP
{{- end }}
