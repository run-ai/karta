{{- if .Values.exporter.enabled -}}
{{/*
The bound ClusterRole aggregates every ClusterRole labeled
karta.run.ai/exporter-rbac: "true". The base role below carries the chart's
default read rules; platform teams grant access for custom Kartas by adding
one labeled ClusterRole, without a chart upgrade.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        karta.run.ai/exporter-rbac: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "karta.exporter.fullname" . }}-base
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
    karta.run.ai/exporter-rbac: "true"
rules:
  # Karta definitions drive everything else the exporter watches
  - apiGroups: ["run.ai"]
    resources: ["kartas"]
    verbs: ["get", "list", "watch"]

  # Pods are the attribution subject
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Kind-to-resource discovery for the dynamic workload watchers
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # Workload and child kinds, enumerated (no wildcards). Extend via values
  # or with an extra ClusterRole labeled karta.run.ai/exporter-rbac: "true".
  {{- range .Values.exporter.rbac.workloadRules }}
  - apiGroups: [{{ .apiGroups | join ", " | quote }}]
    resources:
      {{- range .resources }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get", "list", "watch"]
  {{- end }}
{{- end }}
