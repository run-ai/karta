{{- if and .Values.exporter.enabled .Values.exporter.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "karta.exporter.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      # The identity series carry namespace and pod labels of the attributed
      # pods; without honor_labels Prometheus would overwrite them with the
      # exporter's own target labels and every join would silently miss.
      honorLabels: true
      # The exposition grows with pod count; the default 10s scrape timeout
      # is too tight on large clusters.
      interval: {{ .Values.exporter.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.exporter.serviceMonitor.scrapeTimeout }}
{{- end }}
