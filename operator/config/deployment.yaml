apiVersion: apps/v1
kind: Deployment
metadata:
  name: karta-operator
  namespace: karta
  labels:
    app: karta-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karta-operator
  template:
    metadata:
      labels:
        app: karta-operator
    spec:
      serviceAccountName: karta-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 0
      containers:
        - name: karta-operator
          image: karta-operator:local
          imagePullPolicy: Never   # image is loaded directly into minikube
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --zap-log-level=debug
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
